[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dealflow"
version = "0.1.0"
description = "Single-file, stdlib-only wholesale real-estate pipeline engine (SQLite state machine)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
dealflow = "dealflow:main"

[tool.setuptools]
py-modules = ["dealflow", "fetch_massgis"]
